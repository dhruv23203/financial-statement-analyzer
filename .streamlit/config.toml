# Dark "trading terminal" theme for the dashboard (colours follow app/reporting/ui.py).
[theme]
base = "dark"
primaryColor = "#2962ff"
backgroundColor = "#0a0e17"
secondaryBackgroundColor = "#111827"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
