# Alembic configuration.
# The application sets script_location and sqlalchemy.url programmatically
# (see app/database/connection.py), so normally you never call alembic directly.
# For manual use from the project root:
#     alembic upgrade head
#     alembic revision --autogenerate -m "describe change"
[alembic]
script_location = app/database/migrations
prepend_sys_path = .
path_separator = os
# Default URL for the alembic CLI; FSA_DB_PATH (if set) overrides it in env.py.
sqlalchemy.url = sqlite:///data/financial_analyzer.db
